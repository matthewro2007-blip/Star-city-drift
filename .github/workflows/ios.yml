# Streets of Roanoke: unsigned iPhone .ipa (Capacitor wrapper around the same web build as the site).
# Runs on GitHub's macOS runner. Output:
#   - workflow artifact  "Streets-of-Roanoke-<version>-ipa"
#   - release asset      tag ios-v<version>, file Streets-of-Roanoke-<version>.ipa
#   - committed file     downloads/iphone/Streets-of-Roanoke-<version>.ipa  (the site's download link)
# The .ipa is NOT signed. Players sign it on their own device with AltStore / Sideloadly (see downloads/iphone/IPHONE.txt).
# 2.0.1 follow-up: the squash commit changed too many files for the path filter, so this push starts the build.
# Retry: the first macos-26 run was cancelled after 15 minutes with no runner.
name: iOS unsigned ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios.yml'
      - 'js/version.js'

permissions:
  contents: write

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  ipa:
    # macos-26 (arm64) queued for 15 minutes and was cancelled with no runner, same as the
    # 2.0.0 macos-15 job. macos-26-intel is the macOS 26 image (Xcode 26+) on the Intel pool.
    runs-on: macos-26-intel
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the game version
        id: v
        run: |
          V=$(sed -nE "s/.*GAME_VERSION = '([^']+)'.*/\1/p" js/version.js)
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building Streets of Roanoke $V"

      - name: Copy the web build into ios-app/www
        run: |
          mkdir -p ios-app/www
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude 'ios-app' --exclude 'downloads' --exclude 'site' \
            --exclude 'tools' --exclude 'node_modules' --exclude '*.md' --exclude '*.py' \
            ./ ios-app/www/
          test -f ios-app/www/index.html
          test -f ios-app/www/js/main.js
          du -sh ios-app/www

      - name: Voice-over for iOS (m4a only)
        run: |
          # 1.9.0+: the site keeps assets/vo with .ogg + .m4a (web picks by canPlayType; never precached).
          # The .ipa keeps only the AAC clips and marks the manifest bundled=m4a so WKWebView requests .m4a only.
          if [ -f ios-app/www/assets/vo/manifest.json ]; then
            find ios-app/www/assets/vo -name '*.ogg' -delete
            node -e "const f='ios-app/www/assets/vo/manifest.json',fs=require('fs'),m=JSON.parse(fs.readFileSync(f));m.bundled='m4a';fs.writeFileSync(f,JSON.stringify(m))"
            echo "VO: $(find ios-app/www/assets/vo -name '*.m4a' | wc -l) m4a clips"
          else
            echo "VO: none on the site (text + blips only)"
          fi

      - name: Install Capacitor and sync the iOS project
        working-directory: ios-app
        run: |
          npm install --no-audit --no-fund
          npx cap sync ios

      - name: Build (unsigned)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION='${{ steps.v.outputs.version }}' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa (Payload/App.app, zipped)
        id: ipa
        run: |
          V='${{ steps.v.outputs.version }}'
          APP=ios-app/ios/App/build/Build/Products/Release-iphoneos/App.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          NAME="Streets-of-Roanoke-$V.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$NAME"
          ls -lh "$NAME"
          shasum -a 256 "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Streets-of-Roanoke-${{ steps.v.outputs.version }}-ipa
          path: ${{ steps.ipa.outputs.name }}
          if-no-files-found: error

      - name: Attach to the GitHub release ios-v${{ steps.v.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-v${{ steps.v.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Streets of Roanoke ${{ steps.v.outputs.version }} (iPhone, unsigned)" --notes "Unsigned iPhone build. Read downloads/iphone/IPHONE.txt before installing."
          gh release upload "$TAG" "${{ steps.ipa.outputs.name }}" --clobber

      - name: Commit to downloads/iphone/
        run: |
          mkdir -p downloads/iphone
          cp "${{ steps.ipa.outputs.name }}" downloads/iphone/
          # GitHub rejects git blobs over 100 MB. The 2.0.0 .ipa was 203 MB, and players
          # download this one from the ios-v release (the iPhone page links there).
          SIZE=$(stat -f%z "downloads/iphone/${{ steps.ipa.outputs.name }}")
          if [ "$SIZE" -gt 95000000 ]; then
            echo "ipa is ${SIZE} bytes, over GitHub's 100 MB git limit. It stays on the release only."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/iphone/${{ steps.ipa.outputs.name }}"
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "iPhone: unsigned ${{ steps.ipa.outputs.name }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
